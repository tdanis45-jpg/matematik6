<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Matematik Bomberman | Ortak Bölenler ve Katlar (6. Sınıf)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: 'Fredoka', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 780px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
    }
    .lives { color: #f43f5e; }
    .score { color: #facc15; }
    .level { color: #38bdf8; }
    .target-box {
      background: linear-gradient(90deg, #1e1b4b, #312e81);
      border: 2px solid #6366f1;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .target-title {
      font-size: 15px;
      font-weight: 800;
      color: #e0e7ff;
    }
    .target-progress {
      background: #4f46e5;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
    }
    .game-container {
      position: relative;
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-width: 780px;
      height: auto;
      aspect-ratio: 13 / 11;
      border: 3px solid #334155;
      border-radius: 16px;
      background-color: #0f172a;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: block;
    }
    /* Mobile Controls */
    .mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 780px;
      margin-top: 12px;
      padding: 0 8px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
    }
    .ctrl-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid #475569;
      color: #f8fafc;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .ctrl-btn:active {
      background: #4f46e5;
      transform: scale(0.95);
    }
    .btn-bomb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      border: 3px solid #fca5a5;
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 6px 15px rgba(239, 68, 68, 0.4);
      cursor: pointer;
      touch-action: none;
    }
    .btn-bomb:active {
      transform: scale(0.92);
      background: #dc2626;
    }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-content {
      background: #1e293b;
      border: 2px solid #6366f1;
      border-radius: 20px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .modal-body {
      font-size: 16px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 20px;
      text-align: left;
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .modal-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
    }
    .modal-btn:hover {
      background: #4338ca;
    }
    .btn-sound {
      background: #334155;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="hud-top">
      <div class="stat-badge lives">❤️ Can: <span id="lives-val">3</span></div>
      <div class="stat-badge score">⭐ Puan: <span id="score-val">0</span></div>
      <div class="stat-badge level">🎮 <span id="level-val">Bölüm 1</span></div>
      <button class="btn-sound" id="btn-sound" onclick="toggleSound()">🔊 Ses: Açık</button>
    </div>
    <div class="target-box">
      <div class="target-title" id="target-title">Yükleniyor...</div>
      <div class="target-progress" id="target-progress">0/3</div>
    </div>
  </header>

  <div class="game-container">
    <canvas id="gameCanvas" width="624" height="528"></canvas>
  </div>

  <div class="mobile-controls">
    <div class="dpad">
      <div></div>
      <button class="ctrl-btn" onpointerdown="startMove('up')" onpointerup="stopMove('up')" onpointercancel="stopMove('up')">▲</button>
      <div></div>
      <button class="ctrl-btn" onpointerdown="startMove('left')" onpointerup="stopMove('left')" onpointercancel="stopMove('left')">◀</button>
      <div></div>
      <button class="ctrl-btn" onpointerdown="startMove('right')" onpointerup="stopMove('right')" onpointercancel="stopMove('right')">▶</button>
      <div></div>
      <button class="ctrl-btn" onpointerdown="startMove('down')" onpointerup="stopMove('down')" onpointercancel="stopMove('down')">▼</button>
      <div></div>
    </div>
    <button class="btn-bomb" onpointerdown="triggerBomb()">BOMBA💣</button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Tebrikler!</div>
      <div class="modal-body" id="modalBody"></div>
      <button class="modal-btn" id="modalBtn" onclick="closeModal()">Devam Et</button>
    </div>
  </div>

  <script>
    // --- 1. WEB AUDIO SYNTHESIZER ---
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isSoundOn = true;

    function getAudioCtx() {
      if (!audioCtx && AudioContextClass) audioCtx = new AudioContextClass();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      document.getElementById('btn-sound').innerText = isSoundOn ? '🔊 Ses: Açık' : '🔇 Ses: Kapalı';
    }

    function sfxBomb() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx(); if (!ctx) return;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.12);
    }

    function sfxExplosion() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx(); if (!ctx) return;
      const dur = 0.4, buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(700, ctx.currentTime); f.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + dur);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      src.start(); src.stop(ctx.currentTime + dur);
    }

    function sfxCorrect() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx(); if (!ctx) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
        g.gain.setValueAtTime(0, ctx.currentTime + idx * 0.07);
        g.gain.linearRampToValueAtTime(0.2, ctx.currentTime + idx * 0.07 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.22);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.07); osc.stop(ctx.currentTime + idx * 0.07 + 0.22);
      });
    }

    function sfxWrong() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx(); if (!ctx) return;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(120, ctx.currentTime + 0.25);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    }

    // --- 2. GAME LEVELS & MATH ---
    const LEVELS = [
      {
        id: 1,
        title: "Bölüm 1: Ortak Bölenler",
        question: "12 ve 18 sayılarının ORTAK BÖLENİ olan kutuları patlat!",
        correct: [1, 2, 3, 6],
        needed: 3,
        explanation: "12'nin bölenleri: 1, 2, 3, 4, 6, 12<br>18'in bölenleri: 1, 2, 3, 6, 9, 18<br><b>Ortak Bölenler: 1, 2, 3, 6</b> (EBOB = 6)"
      },
      {
        id: 2,
        title: "Bölüm 2: Ortak Katlar",
        question: "4 ve 6 sayılarının ORTAK KATI olan kutuları patlat!",
        correct: [12, 24, 36, 48],
        needed: 3,
        explanation: "4'ün katları: 4, 8, 12, 16, 20, 24, 28, 32, 36...<br>6'nın katları: 6, 12, 18, 24, 30, 36...<br><b>Ortak Katlar: 12, 24, 36...</b> (EKOK = 12)"
      },
      {
        id: 3,
        title: "Bölüm 3: EBOB (En Büyük Ortak Bölen)",
        question: "20 ve 30'un EN BÜYÜK ORTAK BÖLENİ'ni (EBOB) patlat!",
        correct: [10],
        needed: 1,
        explanation: "20 ve 30 sayılarının ortak bölenleri {1, 2, 5, 10}'dur.<br>Bu ortak bölenlerin en büyüğü <b>10</b>'dur! EBOB(20, 30) = 10"
      },
      {
        id: 4,
        title: "Bölüm 4: EKOK (En Küçük Ortak Kat)",
        question: "8 ve 12'nin EN KÜÇÜK ORTAK KATI'nı (EKOK) patlat!",
        correct: [24],
        needed: 1,
        explanation: "8'in katları: 8, 16, 24, 32, 40...<br>12'nin katları: 12, 24, 36, 48...<br>Ortak katların en küçüğü <b>24</b>'tür! EKOK(8, 12) = 24"
      }
    ];

    // --- 3. GAME STATE ---
    const COLS = 13, ROWS = 11, CELL_SIZE = 48;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentLevelIndex = 0;
    let score = 0;
    let lives = 3;
    let currentGoal = LEVELS[0];
    let collectedCount = 0;
    let isGameOver = false;
    let isLevelWon = false;
    let isPaused = false;

    let player = { x: 1, y: 1, speed: 3.2, direction: 'down', isMoving: false, invul: 0 };
    let activeKeys = { up: false, down: false, left: false, right: false };
    let grid = []; // 0: empty, 1: solid wall, 2: breakable
    let blocks = []; // { gridX, gridY, number, isTarget }
    let bombs = [];
    let explosions = [];
    let monsters = [];
    let floatingTexts = [];

    function initLevel(levelIdx) {
      currentLevelIndex = levelIdx % LEVELS.length;
      currentGoal = LEVELS[currentLevelIndex];
      collectedCount = 0;
      isLevelWon = false;
      isPaused = false;

      document.getElementById('level-val').innerText = currentGoal.title;
      document.getElementById('target-title').innerText = currentGoal.question;
      document.getElementById('target-progress').innerText = `0/${currentGoal.needed}`;
      document.getElementById('lives-val').innerText = lives;
      document.getElementById('score-val').innerText = score;

      player.x = 1; player.y = 1; player.invul = 1;
      bombs = []; explosions = []; floatingTexts = []; blocks = []; monsters = [];

      // Generate Grid
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
            grid[r][c] = 1; // outer wall
          } else if (r % 2 === 0 && c % 2 === 0) {
            grid[r][c] = 1; // solid pillar
          } else {
            grid[r][c] = 0;
          }
        }
      }

      // Safe player zone
      const safe = ['1,1', '1,2', '2,1'];

      // Populate breakable boxes
      const potentialCells = [];
      for (let r = 1; r < ROWS - 1; r++) {
        for (let c = 1; c < COLS - 1; c++) {
          if (grid[r][c] === 0 && !safe.includes(`${c},${r}`)) {
            potentialCells.push({ c, r });
          }
        }
      }

      // Shuffle cells
      potentialCells.sort(() => Math.random() - 0.5);
      const totalBlocks = Math.floor(potentialCells.length * 0.65);
      const chosenCells = potentialCells.slice(0, totalBlocks);

      // Distribute numbers
      const correctSet = new Set(currentGoal.correct);
      let targetCount = currentGoal.needed + 2;

      chosenCells.forEach((cell, idx) => {
        let num;
        if (idx < targetCount) {
          num = currentGoal.correct[idx % currentGoal.correct.length];
        } else {
          // distractor
          num = Math.floor(Math.random() * 20) + 2;
          if (correctSet.has(num)) num += 1;
        }
        grid[cell.r][cell.c] = 2;
        blocks.push({ gridX: cell.c, gridY: cell.r, number: num, isTarget: correctSet.has(num) });
      });

      // Spawn 2 monsters in empty spots far from player
      const emptyCells = potentialCells.slice(totalBlocks).filter(cell => (cell.c + cell.r) > 6);
      emptyCells.slice(0, 2).forEach((cell, i) => {
        monsters.push({
          x: cell.c, y: cell.r,
          dir: i === 0 ? 'right' : 'down',
          speed: 1.2,
          timer: 0
        });
      });
    }

    // --- 4. CONTROLS ---
    window.addEventListener('keydown', (e) => {
      getAudioCtx();
      const code = e.code;
      const key = e.key;
      const keyLower = key.toLowerCase();

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(key) || ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) {
        e.preventDefault();
      }

      if (code === 'ArrowUp' || key === 'ArrowUp' || code === 'KeyW' || keyLower === 'w') activeKeys.up = true;
      if (code === 'ArrowDown' || key === 'ArrowDown' || code === 'KeyS' || keyLower === 's') activeKeys.down = true;
      if (code === 'ArrowLeft' || key === 'ArrowLeft' || code === 'KeyA' || keyLower === 'a') activeKeys.left = true;
      if (code === 'ArrowRight' || key === 'ArrowRight' || code === 'KeyD' || keyLower === 'd') activeKeys.right = true;
      if (code === 'Space' || key === ' ' || code === 'Enter' || keyLower === 'enter') { triggerBomb(); }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
      const code = e.code;
      const key = e.key;
      const keyLower = key.toLowerCase();

      if (code === 'ArrowUp' || key === 'ArrowUp' || code === 'KeyW' || keyLower === 'w') activeKeys.up = false;
      if (code === 'ArrowDown' || key === 'ArrowDown' || code === 'KeyS' || keyLower === 's') activeKeys.down = false;
      if (code === 'ArrowLeft' || key === 'ArrowLeft' || code === 'KeyA' || keyLower === 'a') activeKeys.left = false;
      if (code === 'ArrowRight' || key === 'ArrowRight' || code === 'KeyD' || keyLower === 'd') activeKeys.right = false;
    });

    window.addEventListener('blur', () => {
      activeKeys = { up: false, down: false, left: false, right: false };
    });

    function startMove(dir) { getAudioCtx(); activeKeys[dir] = true; }
    function stopMove(dir) { activeKeys[dir] = false; }

    function triggerBomb() {
      if (isPaused || isGameOver || isLevelWon) return;
      const gx = Math.round(player.x), gy = Math.round(player.y);
      if (bombs.some(b => b.gx === gx && b.gy === gy)) return;
      if (bombs.length >= 2) return;
      bombs.push({ gx, gy, timer: 2.3 });
      sfxBomb();
    }

    // --- 5. GAME LOOP & UPDATE ---
    let lastTime = performance.now();

    function update(dt) {
      if (isPaused || isGameOver || isLevelWon) return;

      if (player.invul > 0) player.invul -= dt;

      // Player Movement
      let vx = 0, vy = 0;
      if (activeKeys.up) { vy -= 1; player.direction = 'up'; }
      if (activeKeys.down) { vy += 1; player.direction = 'down'; }
      if (activeKeys.left) { vx -= 1; player.direction = 'left'; }
      if (activeKeys.right) { vx += 1; player.direction = 'right'; }

      player.isMoving = vx !== 0 || vy !== 0;
      if (player.isMoving) {
        const moveDist = player.speed * dt;
        const targetX = player.x + vx * moveDist;
        const targetY = player.y + vy * moveDist;

        // Collision box
        const r = 0.35;
        function canPass(x, y) {
          const minGX = Math.floor(x - r + 0.5);
          const maxGX = Math.floor(x + r + 0.5);
          const minGY = Math.floor(y - r + 0.5);
          const maxGY = Math.floor(y + r + 0.5);
          for (let gy = minGY; gy <= maxGY; gy++) {
            for (let gx = minGX; gx <= maxGX; gx++) {
              if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return false;
              if (grid[gy] && grid[gy][gx] !== 0) return false;
              if (bombs.some(b => b.gx === gx && b.gy === gy && (Math.round(player.x) !== gx || Math.round(player.y) !== gy))) return false;
            }
          }
          return true;
        }

        if (canPass(targetX, player.y)) {
          player.x = targetX;
        } else {
          const nearY = Math.round(player.y);
          if (Math.abs(player.y - nearY) > 0.02 && canPass(targetX, nearY)) {
            player.y += Math.sign(nearY - player.y) * Math.min(moveDist * 0.7, Math.abs(nearY - player.y));
          }
        }

        if (canPass(player.x, targetY)) {
          player.y = targetY;
        } else {
          const nearX = Math.round(player.x);
          if (Math.abs(player.x - nearX) > 0.02 && canPass(nearX, targetY)) {
            player.x += Math.sign(nearX - player.x) * Math.min(moveDist * 0.7, Math.abs(nearX - player.x));
          }
        }
      }

      // Bombs update
      for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];
        b.timer -= dt;
        if (b.timer <= 0) {
          explodeBomb(b);
          bombs.splice(i, 1);
        }
      }

      // Explosions update
      for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        exp.timer -= dt;
        if (exp.timer <= 0) {
          explosions.splice(i, 1);
        } else {
          // Check if touches player
          if (player.invul <= 0 && Math.abs(player.x - exp.gx) < 0.6 && Math.abs(player.y - exp.gy) < 0.6) {
            damagePlayer();
          }
        }
      }

      // Monsters update
      monsters.forEach(m => {
        m.timer += dt;
        const speed = m.speed * dt;
        let nx = m.x, ny = m.y;
        if (m.dir === 'up') ny -= speed;
        if (m.dir === 'down') ny += speed;
        if (m.dir === 'left') nx -= speed;
        if (m.dir === 'right') nx += speed;

        const mgx = Math.round(nx), mgy = Math.round(ny);
        if (grid[mgy] && grid[mgy][mgx] === 0) {
          m.x = nx; m.y = ny;
        } else {
          // Change direction
          const dirs = ['up', 'down', 'left', 'right'];
          m.dir = dirs[Math.floor(Math.random() * dirs.length)];
        }

        // Damage player on touch
        if (player.invul <= 0 && Math.hypot(player.x - m.x, player.y - m.y) < 0.6) {
          damagePlayer();
        }
      });

      // Floating texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 30 * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function damagePlayer() {
      lives--;
      player.invul = 2;
      document.getElementById('lives-val').innerText = lives;
      if (lives <= 0) {
        isGameOver = true;
        showModal('Oyun Bitti!', 'Canların tükendi. Matematik kurallarını inceleyip tekrar denemek ister misin?<br><br>' + currentGoal.explanation, 'Yeniden Başla');
      }
    }

    function explodeBomb(bomb) {
      sfxExplosion();
      const cells = [{ gx: bomb.gx, gy: bomb.gy }];
      const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];

      dirs.forEach(([dx, dy]) => {
        for (let step = 1; step <= 2; step++) {
          const gx = bomb.gx + dx * step;
          const gy = bomb.gy + dy * step;
          if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) break;
          if (grid[gy][gx] === 1) break; // stop at pillar

          cells.push({ gx, gy });

          if (grid[gy][gx] === 2) {
            // Destroy box!
            grid[gy][gx] = 0;
            const bIdx = blocks.findIndex(b => b.gridX === gx && b.gridY === gy);
            if (bIdx !== -1) {
              const destroyedBlock = blocks[bIdx];
              blocks.splice(bIdx, 1);
              handleBlockDestroyed(destroyedBlock);
            }
            break; // blast stops after destroying crate
          }
        }
      });

      cells.forEach(c => explosions.push({ gx: c.gx, gy: c.gy, timer: 0.4 }));

      // Kill monsters in blast
      for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];
        if (cells.some(c => Math.hypot(m.x - c.gx, m.y - c.gy) < 0.7)) {
          monsters.splice(i, 1);
          score += 150;
          document.getElementById('score-val').innerText = score;
        }
      }
    }

    function handleBlockDestroyed(block) {
      if (block.isTarget) {
        sfxCorrect();
        collectedCount++;
        score += 100;
        document.getElementById('score-val').innerText = score;
        document.getElementById('target-progress').innerText = `${collectedCount}/${currentGoal.needed}`;
        floatingTexts.push({ x: block.gridX * CELL_SIZE + 24, y: block.gridY * CELL_SIZE + 24, text: `+${block.number} DOĞRU!`, color: '#22c55e', life: 1.2 });

        if (collectedCount >= currentGoal.needed) {
          isLevelWon = true;
          setTimeout(() => {
            showModal('Bölüm Tamamlandı! 🎉', `Harika iş çıkardın!<br><br>${currentGoal.explanation}`, 'Sonraki Bölüm');
          }, 400);
        }
      } else {
        sfxWrong();
        score = Math.max(0, score - 20);
        document.getElementById('score-val').innerText = score;
        floatingTexts.push({ x: block.gridX * CELL_SIZE + 24, y: block.gridY * CELL_SIZE + 24, text: `${block.number} Kurala Uymadı!`, color: '#ef4444', life: 1.4 });
      }
    }

    // --- 6. RENDER ---
    function render() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Floor
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#1e293b' : '#172033';
          ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }

      // Solid Walls
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === 1) {
            ctx.fillStyle = '#334155';
            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            ctx.fillStyle = '#475569';
            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, 4);
            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, 4, CELL_SIZE);
          }
        }
      }

      // Breakable Blocks
      blocks.forEach(b => {
        const x = b.gridX * CELL_SIZE, y = b.gridY * CELL_SIZE;
        ctx.fillStyle = '#d97706';
        ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.roundRect(x + 6, y + 6, CELL_SIZE - 12, CELL_SIZE - 12, 6);
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 16px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.number.toString(), x + CELL_SIZE / 2, y + CELL_SIZE / 2);
      });

      // Bombs
      bombs.forEach(b => {
        const cx = b.gx * CELL_SIZE + CELL_SIZE / 2, cy = b.gy * CELL_SIZE + CELL_SIZE / 2;
        ctx.fillStyle = '#020617';
        ctx.beginPath();
        ctx.arc(cx, cy, CELL_SIZE * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(cx - 2, cy - CELL_SIZE * 0.45, 4, 6);
      });

      // Explosions
      explosions.forEach(exp => {
        const cx = exp.gx * CELL_SIZE + CELL_SIZE / 2, cy = exp.gy * CELL_SIZE + CELL_SIZE / 2;
        ctx.fillStyle = 'rgba(239, 68, 68, 0.7)';
        ctx.beginPath();
        ctx.arc(cx, cy, CELL_SIZE * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(251, 191, 36, 0.9)';
        ctx.beginPath();
        ctx.arc(cx, cy, CELL_SIZE * 0.25, 0, Math.PI * 2);
        ctx.fill();
      });

      // Monsters
      monsters.forEach(m => {
        const cx = m.x * CELL_SIZE + CELL_SIZE / 2, cy = m.y * CELL_SIZE + CELL_SIZE / 2;
        ctx.fillStyle = '#a855f7';
        ctx.beginPath();
        ctx.arc(cx, cy, CELL_SIZE * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx - 5, cy - 3, 3, 0, Math.PI * 2);
        ctx.arc(cx + 5, cy - 3, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Player
      if (player.invul <= 0 || Math.floor(performance.now() / 100) % 2 === 0) {
        const px = player.x * CELL_SIZE + CELL_SIZE / 2, py = player.y * CELL_SIZE + CELL_SIZE / 2;
        ctx.fillStyle = '#2563eb';
        ctx.beginPath();
        ctx.arc(px, py, CELL_SIZE * 0.36, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px, py - 4, CELL_SIZE * 0.26, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(px, py - CELL_SIZE * 0.36, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Floating Texts
      floatingTexts.forEach(ft => {
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 15px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
      });
    }

    function gameLoop(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;
      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    // Modal UI
    function showModal(title, text, btnText) {
      isPaused = true;
      document.getElementById('modalTitle').innerHTML = title;
      document.getElementById('modalBody').innerHTML = text;
      document.getElementById('modalBtn').innerText = btnText;
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('gameModal').style.display = 'none';
      if (isGameOver) {
        lives = 3; score = 0;
        initLevel(0);
      } else if (isLevelWon) {
        initLevel(currentLevelIndex + 1);
      }
    }

    // Start
    initLevel(0);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
